<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Namma Metro Digital Twin - 3D Bangalore Topology</title>

  <!-- MapLibre GL JS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }

    #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* Header bar */
    .app-header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
      padding: 8px 16px; display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid #e0e0e0; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .app-header h1 { font-size: 16px; font-weight: 600; color: #1a1a1a; }
    .app-header .subtitle { font-size: 11px; color: #666; }

    /* Control buttons */
    .control-bar { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
    .control-btn {
      padding: 6px 12px; border: 1px solid #ccc; border-radius: 6px;
      background: #fff; font-size: 12px; cursor: pointer; transition: all 0.2s;
    }
    .control-btn:hover { background: #f0f0f0; }
    .control-btn.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    .control-btn.terrain-active { background: #2e7d32; color: #fff; border-color: #2e7d32; }
    .control-btn.cinematic { background: #6200ea; color: #fff; border-color: #6200ea; }
    .control-btn.cinematic:hover { background: #7c4dff; border-color: #7c4dff; }
    .control-btn.reset { background: #455a64; color: #fff; border-color: #455a64; }
    .control-btn.reset:hover { background: #607d8b; border-color: #607d8b; }

    /* Realtime status indicator */
    .realtime-indicator {
      display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 4px 10px;
      border-radius: 12px; background: rgba(255,255,255,0.9);
    }
    .realtime-indicator .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
    }
    .realtime-indicator.live .status-dot { background: #4CAF50; animation: pulse 1.5s infinite; }
    .realtime-indicator.simulated .status-dot { background: #FF9800; }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
    }

    /* 3D Terrain controls panel */
    #terrain-controls {
      position: absolute; bottom: 24px; right: 16px; z-index: 10;
    }
    .terrain-panel {
      background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
      border-radius: 10px; padding: 14px 18px; min-width: 200px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12); border: 1px solid #e0e0e0;
    }
    .terrain-panel h3 { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #333; }
    .terrain-panel input[type=range] {
      width: 100%; margin: 4px 0; accent-color: #2e7d32;
    }
    .terrain-panel .slider-label {
      display: flex; justify-content: space-between; font-size: 11px; color: #666; margin-top: 2px;
    }
    .terrain-panel .slider-row {
      margin-bottom: 8px;
    }
    .terrain-panel .slider-row label {
      font-size: 12px; color: #444; font-weight: 500;
    }
    .terrain-info {
      font-size: 10px; color: #999; margin-top: 8px; line-height: 1.4;
      border-top: 1px solid #eee; padding-top: 8px;
    }

    /* Temporal controls panel */
    #temporal-controls {
      position: absolute; bottom: 24px; left: 16px; z-index: 10;
    }
    .temporal-panel {
      background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
      border-radius: 10px; padding: 14px 18px; min-width: 220px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12); border: 1px solid #e0e0e0;
    }
    .temporal-panel h3 { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #333; }
    .temporal-panel input[type=range] { width: 100%; margin: 4px 0; accent-color: #1a73e8; }
    .timeline-label { font-size: 12px; color: #1a73e8; font-weight: 500; margin-bottom: 10px; }
    .legend-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 11px; }
    .legend-color { width: 14px; height: 4px; border-radius: 2px; flex-shrink: 0; }
    .legend-name { flex: 1; color: #333; }
    .legend-status { font-size: 10px; padding: 1px 6px; border-radius: 3px; text-transform: capitalize; }
    .legend-status.operational { background: #e8f5e9; color: #2e7d32; }
    .legend-status.under_construction { background: #fff3e0; color: #e65100; }
    .legend-status.planned { background: #e3f2fd; color: #1565c0; }

    /* Station side panel */
    #station-modal-container {
      position: absolute; top: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
    }
    .station-panel {
      position: absolute; top: 50px; right: 0; bottom: 0; width: 360px;
      background: rgba(255,255,255,0.98); backdrop-filter: blur(12px);
      border-left: 1px solid #e0e0e0; box-shadow: -4px 0 20px rgba(0,0,0,0.1);
      transform: translateX(100%); transition: transform 0.3s ease;
      overflow-y: auto; pointer-events: auto;
    }
    .station-panel.open { transform: translateX(0); }
    .panel-close {
      position: absolute; top: 12px; right: 12px; background: none; border: none;
      font-size: 24px; cursor: pointer; color: #666; z-index: 1; line-height: 1;
    }
    .station-header {
      padding: 20px 20px 16px; border-bottom: 1px solid #eee;
    }
    .station-header h2 { font-size: 18px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
    .station-line-badge {
      display: inline-block; padding: 2px 10px; border-radius: 4px;
      color: #fff; font-size: 11px; font-weight: 500;
    }
    .junction-badge {
      display: inline-block; padding: 2px 10px; border-radius: 4px;
      background: #111; color: #fff; font-size: 11px; font-weight: 500; margin-left: 4px;
    }
    .station-section { padding: 16px 20px; border-bottom: 1px solid #f0f0f0; }
    .station-section h3 { font-size: 13px; font-weight: 600; color: #555; margin-bottom: 10px; }

    .facility-grid { display: flex; flex-direction: column; gap: 10px; }
    .facility {
      display: flex; align-items: flex-start; gap: 10px; padding: 10px;
      border-radius: 8px; background: #f8f9fa;
    }
    .facility-icon {
      width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center;
      justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0;
    }
    .facility.available .facility-icon { background: #4CAF50; color: #fff; }
    .facility.unavailable .facility-icon { background: #bbb; color: #fff; }
    .facility.placeholder .facility-icon { background: #2196F3; color: #fff; }
    .facility-label { font-size: 12px; font-weight: 600; color: #333; }
    .facility-status { font-size: 11px; color: #777; }

    .property-info { background: #f8f9fa; border-radius: 8px; padding: 12px; }
    .price-display { display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px; }
    .price-value { font-size: 22px; font-weight: 700; color: #1a1a1a; }
    .price-unit { font-size: 12px; color: #888; }
    .price-meta { display: flex; gap: 12px; font-size: 12px; }
    .price-trend { font-weight: 600; }
    .trend-up { color: #2e7d32; }
    .trend-down { color: #c62828; }
    .trend-stable { color: #f57f17; }
    .price-zone { color: #666; }

    .feeder-routes { display: flex; flex-direction: column; gap: 6px; }
    .feeder-route-btn {
      padding: 8px 12px; background: #fff5ee; border: 1px solid #ffcc80;
      border-radius: 6px; font-size: 11px; cursor: pointer; text-align: left;
      transition: background 0.2s;
    }
    .feeder-route-btn:hover { background: #ffe0b2; }
    .feeder-show-all-btn {
      padding: 8px 12px; background: #FF6600; color: #fff; border: none;
      border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer;
      transition: background 0.2s;
    }
    .feeder-show-all-btn:hover { background: #e55a00; }
  </style>
</head>
<body>
  <!-- Map container -->
  <div id="map"></div>

  <!-- Header -->
  <div class="app-header">
    <div>
      <h1>Namma Metro Digital Twin</h1>
      <div class="subtitle">3D Bangalore Topology &middot; Metro Network &middot; Real Estate</div>
    </div>
    <div id="realtime-status" class="realtime-indicator simulated">
      <span class="status-dot"></span> Connecting...
    </div>
    <div class="control-bar">
      <button class="control-btn active" id="realtime-toggle">Live Trains</button>
      <button class="control-btn" id="heatmap-toggle">Property Heatmap</button>
      <button class="control-btn terrain-active" id="terrain-toggle">3D Terrain</button>
      <button class="control-btn cinematic" id="cinematic-view">Flyover</button>
      <button class="control-btn reset" id="reset-view">Reset View</button>
    </div>
  </div>

  <!-- 3D Terrain controls -->
  <div id="terrain-controls">
    <div class="terrain-panel">
      <h3>3D Terrain</h3>
      <div class="slider-row">
        <label>Elevation Exaggeration</label>
        <input type="range" id="terrain-exaggeration" min="0" max="5" step="0.5" value="2.5">
        <div class="slider-label">
          <span>Flat</span>
          <span id="exaggeration-value">2.5x</span>
          <span>5x</span>
        </div>
      </div>
      <div class="terrain-info">
        Bangalore sits on the Deccan Plateau at ~920m elevation. Drag to rotate, right-click to tilt. Elevation data from AWS Terrain Tiles.
      </div>
    </div>
  </div>

  <!-- Temporal controls -->
  <div id="temporal-controls"></div>

  <!-- Station modal container -->
  <div id="station-modal-container"></div>

  <!-- App entry point -->
  <script type="module" src="src/app.js"></script>
</body>
</html>
